services:
  news_briefing:
    build: .
    container_name: news_briefing
    restart: unless-stopped
    volumes:
      - ./.env:/app/.env:ro
      - ./exports:/app/exports
      - ./cache:/app/.cache
    depends_on:
      news_db:
        condition: service_healthy

  news_db:
    image: postgres:18
    container_name: news_db
    volumes:
      - ./data:/var/lib/postgresql
      - ./init.sql:/docker-entrypoint-initdb.d/my_init.sql:ro
    environment:
      POSTGRES_USER: ${db_user}
      POSTGRES_PASSWORD: ${db_password}
      POSTGRES_DB: ${db_name}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${db_user} -d ${db_name}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    ports:
      - "9432:5432"
