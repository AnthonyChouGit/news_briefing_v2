<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 980" width="100%" height="100%" style="background-color: #0d1117; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#58a6ff" />
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8b949e" />
    </marker>
    <marker id="arrow-success" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3fb950" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.38" />
    </filter>
  </defs>

  <style>
    .header-title { font-size: 16px; font-weight: 700; fill: #f0f6fc; letter-spacing: 0.4px; }
    .node-title { font-size: 13px; font-weight: 600; fill: #e6edf3; }
    .node-sub { font-size: 11px; fill: #8b949e; }
    .badge-text { font-size: 12px; font-weight: 600; fill: #58a6ff; }
    .panel-title { font-size: 12.5px; font-weight: 700; fill: #f0f6fc; }
    .panel-item { font-size: 11.5px; fill: #c9d1d9; }
    .panel-sub { font-size: 10.5px; fill: #8b949e; }
    .conn { fill: none; stroke: #58a6ff; stroke-width: 1.75; stroke-linejoin: round; }
    .conn-ok { fill: none; stroke: #3fb950; stroke-width: 1.85; stroke-linejoin: round; }
    .conn-dashed { fill: none; stroke: #8b949e; stroke-width: 1.5; stroke-dasharray: 4,4; stroke-linejoin: round; }
  </style>

  <!-- Outer Frame -->
  <rect x="10" y="10" width="900" height="960" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="1.5" />

  <!-- Title -->
  <text x="460" y="42" text-anchor="middle" class="header-title">News Briefing v2 — LightDAG Pipeline</text>

  <!-- ==================== CONNECTORS ==================== -->

  <!-- start -> fetch_news, history_news, prune_news -->
  <path d="M 440 102 L 440 116 L 160 116 L 160 130" class="conn" marker-end="url(#arrow)" />
  <path d="M 440 116 L 414 116 L 414 130" class="conn" marker-end="url(#arrow)" />
  <path d="M 440 116 L 716 116 L 716 130" class="conn" marker-end="url(#arrow)" />

  <!-- fetch_news + history_news -> pre_read_rank_news -->
  <path d="M 160 180 L 160 194 L 245 194 L 245 208" class="conn" marker-end="url(#arrow)" />
  <path d="M 414 180 L 414 194 L 329 194 L 329 208" class="conn" marker-end="url(#arrow)" />

  <!-- Spine connections (center x=287) -->
  <path d="M 287 258 L 287 278" class="conn" marker-end="url(#arrow)" />
  <path d="M 287 328 L 287 348" class="conn" marker-end="url(#arrow)" />
  <path d="M 287 398 L 287 418" class="conn" marker-end="url(#arrow)" />
  <path d="M 287 468 L 287 488" class="conn" marker-end="url(#arrow)" />
  <path d="M 287 538 L 287 558" class="conn" marker-end="url(#arrow)" />
  <path d="M 287 608 L 287 628" class="conn" marker-end="url(#arrow)" />
  <path d="M 287 678 L 287 698" class="conn" marker-end="url(#arrow)" />

  <!-- post_summarize_select_news -> save_news + export_news -->
  <path d="M 245 748 L 245 766 L 160 766 L 160 784" class="conn" marker-end="url(#arrow)" />
  <path d="M 329 748 L 329 766 L 414 766 L 414 784" class="conn" marker-end="url(#arrow)" />

  <!-- export_news -> index.html web viewer -->
  <path d="M 526 809 L 576 809" class="conn-dashed" marker-end="url(#arrow-muted)" />

  <!-- save_news + export_news + prune_news -> Terminal Outputs -->
  <path d="M 160 834 L 160 870 L 245 870 L 245 894" class="conn-ok" marker-end="url(#arrow-success)" />
  <path d="M 414 834 L 414 870 L 287 870 L 287 894" class="conn-ok" marker-end="url(#arrow-success)" />
  <path d="M 716 180 L 716 196 L 882 196 L 882 870 L 329 870 L 329 894" class="conn-ok" marker-end="url(#arrow-success)" />

  <!-- ==================== NODES ==================== -->

  <!-- Top Input: start signal -->
  <g filter="url(#shadow)">
    <rect x="360" y="64" width="160" height="38" rx="19" fill="#161b22" stroke="#388bfd" stroke-width="1.8" />
    <text x="440" y="88" text-anchor="middle" class="badge-text">▶ start = true</text>
  </g>

  <!-- Root Operators -->
  <g filter="url(#shadow)">
    <rect x="48" y="130" width="224" height="50" rx="8" fill="#21262d" stroke="#30363d" stroke-width="1.5" />
    <text x="160" y="152" text-anchor="middle" class="node-title">🌐 FetchNewsOperator</text>
    <text x="160" y="168" text-anchor="middle" class="node-sub">fetch_news · Piscina + source cap</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="302" y="130" width="224" height="50" rx="8" fill="#21262d" stroke="#30363d" stroke-width="1.5" />
    <text x="414" y="152" text-anchor="middle" class="node-title">🗄️ HistoryNewsOperator</text>
    <text x="414" y="168" text-anchor="middle" class="node-sub">history_news · PostgreSQL (no raw)</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="604" y="130" width="224" height="50" rx="8" fill="#21262d" stroke="#30363d" stroke-width="1.5" />
    <text x="716" y="152" text-anchor="middle" class="node-title">🧹 PruneNewsOperator</text>
    <text x="716" y="168" text-anchor="middle" class="node-sub">prune_news · Delete expired rows</text>
  </g>

  <!-- Central Pipeline Spine (center x=287) -->
  <g filter="url(#shadow)">
    <rect x="147" y="208" width="280" height="50" rx="8" fill="#21262d" stroke="#388bfd" stroke-width="1.3" />
    <text x="287" y="230" text-anchor="middle" class="node-title">🧠 RankNewsOperator (#1)</text>
    <text x="287" y="246" text-anchor="middle" class="node-sub">pre_read_rank_news · Dedupe &amp; rank (w/ history)</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="147" y="278" width="280" height="50" rx="8" fill="#21262d" stroke="#30363d" stroke-width="1.5" />
    <text x="287" y="300" text-anchor="middle" class="node-title">✂️ SelectNewsOperator (#1)</text>
    <text x="287" y="316" text-anchor="middle" class="node-sub">pre_read_select_news · Pre-read buffer</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="147" y="348" width="280" height="50" rx="8" fill="#21262d" stroke="#30363d" stroke-width="1.5" />
    <text x="287" y="370" text-anchor="middle" class="node-title">📖 ReadNewsOperator</text>
    <text x="287" y="386" text-anchor="middle" class="node-sub">read_news · Piscina full text &amp; date</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="147" y="418" width="280" height="50" rx="8" fill="#21262d" stroke="#30363d" stroke-width="1.5" />
    <text x="287" y="440" text-anchor="middle" class="node-title">⏱️ FilterRecencyOperator</text>
    <text x="287" y="456" text-anchor="middle" class="node-sub">filter_recency · Enforce max age hours</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="147" y="488" width="280" height="50" rx="8" fill="#21262d" stroke="#30363d" stroke-width="1.5" />
    <text x="287" y="510" text-anchor="middle" class="node-title">✂️ SelectNewsOperator (#2)</text>
    <text x="287" y="526" text-anchor="middle" class="node-sub">pre_summarize_select_news · Summarize buffer</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="147" y="558" width="280" height="50" rx="8" fill="#21262d" stroke="#a371f7" stroke-width="1.3" />
    <text x="287" y="580" text-anchor="middle" class="node-title">✨ SummarizeNewsOperator</text>
    <text x="287" y="596" text-anchor="middle" class="node-sub">summarize_news · Filter, title &amp; bullets (raw)</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="147" y="628" width="280" height="50" rx="8" fill="#21262d" stroke="#388bfd" stroke-width="1.3" />
    <text x="287" y="650" text-anchor="middle" class="node-title">🧠 RankNewsOperator (#2)</text>
    <text x="287" y="666" text-anchor="middle" class="node-sub">post_summarize_rank_news · Re-rank (no history)</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="147" y="698" width="280" height="50" rx="8" fill="#21262d" stroke="#30363d" stroke-width="1.5" />
    <text x="287" y="720" text-anchor="middle" class="node-title">✂️ SelectNewsOperator (#3)</text>
    <text x="287" y="736" text-anchor="middle" class="node-sub">post_summarize_select_news · Final category cap</text>
  </g>

  <!-- Output Stage -->
  <g filter="url(#shadow)">
    <rect x="48" y="784" width="224" height="50" rx="8" fill="#21262d" stroke="#30363d" stroke-width="1.5" />
    <text x="160" y="806" text-anchor="middle" class="node-title">💾 SaveNewsOperator</text>
    <text x="160" y="822" text-anchor="middle" class="node-sub">save_news · Insert to PostgreSQL</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="302" y="784" width="224" height="50" rx="8" fill="#21262d" stroke="#30363d" stroke-width="1.5" />
    <text x="414" y="806" text-anchor="middle" class="node-title">📤 ExportNewsOperator</text>
    <text x="414" y="822" text-anchor="middle" class="node-sub">export_news · latest_&lt;lang&gt;.json</text>
  </g>

  <!-- Terminal Status Pill -->
  <g filter="url(#shadow)">
    <rect x="122" y="894" width="330" height="44" rx="22" fill="#1b4728" stroke="#3fb950" stroke-width="1.8" />
    <text x="287" y="921" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3fb950">✅ saved = true · exported = true · pruned = true</text>
  </g>

  <!-- ==================== RIGHT SIDE PANELS ==================== -->

  <!-- Shared Runtime Resources -->
  <g filter="url(#shadow)">
    <rect x="576" y="232" width="280" height="218" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.4" />
    <text x="596" y="260" class="panel-title">⚙️ Shared Runtime Context</text>
    <line x1="596" y1="272" x2="836" y2="272" stroke="#30363d" stroke-width="1" />

    <text x="596" y="296" class="panel-item" font-weight="600">🤖 AIClient (Vercel AI SDK)</text>
    <text x="596" y="313" class="panel-sub">OpenAI · Anthropic · OpenAI-Compatible</text>
    <text x="596" y="328" class="panel-sub">Output.object + jsonrepair middleware</text>

    <text x="596" y="356" class="panel-item" font-weight="600">🐘 BriefNewsRepository (Kysely)</text>
    <text x="596" y="373" class="panel-sub">PostgreSQL pool + inflight query cancel</text>

    <text x="596" y="401" class="panel-item" font-weight="600">🧵 Piscina Thread Pool</text>
    <text x="596" y="418" class="panel-sub">Off-thread HTML/RSS fetch &amp; article read</text>
  </g>

  <!-- Lifecycle and Execution Safeguards -->
  <g filter="url(#shadow)">
    <rect x="576" y="476" width="280" height="224" rx="12" fill="#161b22" stroke="#d29922" stroke-opacity="0.65" stroke-width="1.4" />
    <text x="596" y="504" class="panel-title">🛡️ Execution &amp; Error Model</text>
    <line x1="596" y1="516" x2="836" y2="516" stroke="#30363d" stroke-width="1" />

    <text x="596" y="542" class="panel-item" font-weight="600">♻️ Singleton LightDag</text>
    <text x="596" y="558" class="panel-sub">Built once; reused across cron ticks</text>
    <text x="596" y="573" class="panel-sub">with overlap guard (cron_main.ts)</text>

    <text x="596" y="601" class="panel-item" font-weight="600">⚡ Cooperative AbortSignal</text>
    <text x="596" y="617" class="panel-sub">Cancels AI calls, DB queries &amp; workers</text>
    <text x="596" y="632" class="panel-sub">on dag_timeout / SIGINT / SIGTERM</text>

    <text x="596" y="660" class="panel-item" font-weight="600">🧩 Category Fault Isolation</text>
    <text x="596" y="676" class="panel-sub">Promise.allSettled per category; aborts</text>
    <text x="596" y="690" class="panel-sub">DAG cleanly if all categories fail</text>
  </g>

  <!-- Static Web Viewer -->
  <g filter="url(#shadow)">
    <rect x="576" y="784" width="280" height="50" rx="8" fill="#161b22" stroke="#8b949e" stroke-opacity="0.7" stroke-width="1.4" stroke-dasharray="4,3" />
    <text x="716" y="806" text-anchor="middle" class="node-title">🖥️ Web Viewer (index.html)</text>
    <text x="716" y="822" text-anchor="middle" class="node-sub">/api/news/chinese/{latest, previous}</text>
  </g>
</svg>
